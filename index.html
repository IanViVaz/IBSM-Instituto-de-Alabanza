<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IBSM-Instituto de Alabanza</title>
<style>
:root{--bg:#E8EDF4;--card:#F4F7FB;--ink:#13202A;--muted:#566573;--line:#C8D4E6;--accent:#3A65A4;--bad:#BE382C}
@media (prefers-color-scheme:dark){:root{--bg:#0D1219;--card:#141B25;--ink:#E8EFF3;--muted:#97A8B4;--line:#2A3850;--bad:#FF8074}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:380px;display:grid;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{margin:0;font-size:1.5rem;line-height:1.1}
p{margin:0;color:var(--muted)}
input[type=password]{width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label.chk{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.95rem}
button{height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 1.05rem system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.5}
#err{min-height:1.3em;color:var(--bad);font-size:.95rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>IBSM-Instituto de Alabanza</h1>
  <p>Introduce la contraseña para entrar.</p>
  <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" autofocus required>
  <label class="chk"><input type="checkbox" id="rem" checked> Recordar en este dispositivo</label>
  <button type="submit" id="go">Entrar</button>
  <div id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),el=id=>document.getElementById(id);
const store={get(){try{return localStorage.getItem('tri-key');}catch(_){return null;}},set(v){try{localStorage.setItem('tri-key',v);}catch(_){}},del(){try{localStorage.removeItem('tri-key');}catch(_){}}};
async function decryptWith(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA)));}
/* Cambia esta pantalla por la app sin usar document.write: se reemplaza el contenido y se reactivan los scripts */
function show(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  document.title=d.title;
  document.documentElement.lang=d.documentElement.lang||'es';
  document.head.replaceChildren(...[...d.head.childNodes].map(n=>document.importNode(n,true)));
  [...document.body.attributes].forEach(a=>document.body.removeAttribute(a.name));
  [...d.body.attributes].forEach(a=>document.body.setAttribute(a.name,a.value));
  document.body.replaceChildren(...[...d.body.childNodes].map(n=>document.importNode(n,true)));
  document.querySelectorAll('body script').forEach(old=>{
    const s=document.createElement('script');
    [...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));
    s.textContent=old.textContent;old.replaceWith(s);
  });
}
async function fromPassword(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
el('f').addEventListener('submit',async e=>{
  e.preventDefault();el('err').textContent='';el('go').disabled=true;
  let html;
  try{
    if(!window.crypto||!crypto.subtle)throw {name:'nocrypto'};
    const key=await fromPassword(el('pw').value);
    try{html=await decryptWith(key);}catch(_){throw {name:'bad'};}
    if(el('rem').checked)store.set(btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))));
  }catch(err){
    el('err').textContent=err.name==='nocrypto'?'Este navegador no puede abrir la página. Prueba con Safari o Chrome desde el enlace.':'Contraseña incorrecta.';
    el('go').disabled=false;el('pw').select();return;
  }
  show(html);
});
(async()=>{
  if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r));
  const k=store.get();if(!k||!window.crypto||!crypto.subtle)return;
  try{show(await decryptWith(await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt'])));}catch(_){store.del();}
})();
})();
