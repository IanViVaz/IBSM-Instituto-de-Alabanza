:root{--bg:#E8EDF4;--card:#F6F8FC;--paper:#fff;--ink:#13202A;--muted:#566573;--line:#C8D4E6;--accent:#3A65A4;--accent-b:#5f86c2;--bad:#BE382C;--sh:20 32 52;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1219;--card:#141B25;--paper:#1A2330;--ink:#E8EFF3;--muted:#97A8B4;--line:#2A3850;--accent:#3A65A4;--accent-b:#5b84c4;--bad:#FF8074;--sh:0 0 0;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:16px/1.5 "Figtree Variable",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before{display:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;background-image:repeating-linear-gradient(to bottom,transparent 0 22px,color-mix(in srgb,var(--muted) 18%,transparent) 22px 23px);background-size:100% 115px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 75%);mask-image:linear-gradient(to bottom,#000,transparent 75%)}
main{width:100%;max-width:420px;display:grid;gap:18px;justify-items:center}
.logo{width:60px;height:60px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--accent)}
.logo svg{width:32px;height:32px}
form{width:100%;display:grid;gap:16px;padding:28px 24px 24px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgb(var(--sh)/.05);animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.eyebrow{justify-self:center;font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 85%,var(--ink))}
h1{margin:4px 0 0;text-align:center;font:600 2.05rem/1.05 "Fraunces Variable",Georgia,serif;font-variation-settings:"opsz" 96;letter-spacing:-.025em;text-wrap:balance}
p{margin:0;text-align:center;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.dots{display:flex;justify-content:center;gap:16px;padding:6px 0 2px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:background .12s,border-color .12s,transform .12s}
.dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;width:100%;margin-inline:auto}
.pad button{height:58px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:700 1.5rem "Figtree Variable",system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;transition:background .12s,border-color .12s,transform .08s}
.pad button:hover{border-color:var(--accent)}
.pad button:active{background:color-mix(in srgb,var(--accent) 18%,var(--paper));transform:scale(.96)}
.pad button.fn{color:var(--muted);font-size:1.1rem}
.pad button svg{width:26px;height:26px}
input[type=password],input[type=text]{width:100%;height:54px;padding:0 54px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-size:1.05rem;transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.eye{position:absolute;right:6px;top:6px;width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.eye:hover{color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.eye svg{width:22px;height:22px}
label.chk{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.95rem;cursor:pointer;user-select:none}
label.chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
label.chk input:checked{background:var(--accent);border-color:var(--accent)}
label.chk input:checked::after{content:"";width:6px;height:11px;margin-top:-2px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
button.go{height:56px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:800 1.05rem "Figtree Variable",system-ui,sans-serif;letter-spacing:.01em;cursor:pointer;transition:filter .18s}
button.go:hover:not(:disabled){filter:brightness(1.08)}
button.go:active:not(:disabled){transform:translateY(1px)}
button.go:disabled{opacity:.55;cursor:default}
#err{min-height:1.3em;text-align:center;color:var(--bad);font-size:.95rem;font-weight:600}
form.shake{animation:shake .4s}
.foot{color:var(--muted);font-size:.82rem;letter-spacing:.04em;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){form,form.shake{animation:none}}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),el=id=>document.getElementById(id);
const store={get(){try{return localStorage.getItem('tri-key');}catch(_){return null;}},set(v){try{localStorage.setItem('tri-key',v);}catch(_){}},del(){try{localStorage.removeItem('tri-key');}catch(_){}}};
async function decryptWith(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA)));}
/* Cambia esta pantalla por la app sin usar document.write: se reemplaza el contenido y se reactivan los scripts */
function show(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  document.title=d.title;
  document.documentElement.lang=d.documentElement.lang||'es';
  document.head.replaceChildren(...[...d.head.childNodes].map(n=>document.importNode(n,true)));
  [...document.body.attributes].forEach(a=>document.body.removeAttribute(a.name));
  [...d.body.attributes].forEach(a=>document.body.setAttribute(a.name,a.value));
  document.body.replaceChildren(...[...d.body.childNodes].map(n=>document.importNode(n,true)));
  document.querySelectorAll('body script').forEach(old=>{
    const s=document.createElement('script');
    [...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));
    s.textContent=old.textContent;old.replaceWith(s);
  });
}
async function fromPassword(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
const pw=el('pw'),dots=[...document.querySelectorAll('#dots i')];
function paint(){dots.forEach((d,i)=>d.classList.toggle('on',i<pw.value.length));}
function key(k){
  if(el('go').disabled)return;
  if(k==='c')pw.value='';else if(k==='b')pw.value=pw.value.slice(0,-1);
  else if(/^[0-9]$/.test(k)&&pw.value.length<4)pw.value+=k;
  paint();el('err').textContent='';
  if(pw.value.length===4)setTimeout(()=>el('go').click(),120);
}
el('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b)key(b.dataset.k);});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('b');else if(e.key==='Escape')key('c');});
el('f').addEventListener('submit',async e=>{
  e.preventDefault();el('err').textContent='';el('go').disabled=true;
  let html;
  try{
    if(!window.crypto||!crypto.subtle)throw {name:'nocrypto'};
    const key=await fromPassword(el('pw').value);
    try{html=await decryptWith(key);}catch(_){throw {name:'bad'};}
    if(el('rem').checked)store.set(btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))));
  }catch(err){
    el('err').textContent=err.name==='nocrypto'?'Este navegador no puede abrir la página. Prueba con Safari o Chrome desde el enlace.':'Código incorrecto.';
    el('go').disabled=false;pw.value='';paint();
    const f=el('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');return;
  }
  show(html);
});
(async()=>{
  if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r));
  const k=store.get();if(!k||!window.crypto||!crypto.subtle)return;
  try{show(await decryptWith(await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt'])));}catch(_){store.del();}
})();
})();
